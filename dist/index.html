<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2026년의 일정을 날짜별로 기록하고 관리하는 달력" />
    <meta name="theme-color" content="#6d28d9" />
    <title>2026 데일리 캘린더</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d28d9'/%3E%3Cpath d='M9 7v4m14-4v4M7 13h18M9 9h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2Z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M11 18h4v4h-4z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">YEAR PLANNER</p>
          <h1>2026 캘린더</h1>
        </div>
        <button class="today-button" id="todayButton" type="button">오늘로 이동</button>
      </header>

      <div class="workspace">
        <section class="calendar-card" aria-label="월간 달력">
          <div class="calendar-toolbar">
            <button class="icon-button" id="prevMonth" type="button" aria-label="이전 달">←</button>
            <div class="month-title-wrap" aria-live="polite">
              <p id="monthEn">JANUARY</p>
              <h2 id="monthTitle">2026년 1월</h2>
            </div>
            <button class="icon-button" id="nextMonth" type="button" aria-label="다음 달">→</button>
          </div>

          <div class="weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="날짜 선택"></div>
        </section>

        <aside class="todo-panel" aria-label="선택한 날짜의 할 일">
          <div class="selected-date">
            <p id="selectedYear">2026</p>
            <h2 id="selectedDate">1월 1일</h2>
            <p id="selectedWeekday">목요일</p>
          </div>

          <form class="todo-form" id="todoForm">
            <label for="todoInput">할 일 추가</label>
            <div class="input-row">
              <input id="todoInput" type="text" maxlength="80" placeholder="할 일을 입력하세요" autocomplete="off" required />
              <button type="submit" aria-label="할 일 추가">추가</button>
            </div>
          </form>

          <div class="todo-summary">
            <h3>오늘의 목록</h3>
            <span id="todoCount">0개</span>
          </div>
          <ul class="todo-list" id="todoList" aria-live="polite"></ul>
          <p class="empty-state" id="emptyState">아직 등록된 할 일이 없습니다.<br />첫 번째 일정을 추가해 보세요.</p>
        </aside>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
